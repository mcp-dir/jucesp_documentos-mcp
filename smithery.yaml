# Smithery configuration for JUCESP: Lista de Documentos
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_jucesp_documentos

name: jucesp_documentos-mcp
displayName: "JUCESP: Lista de Documentos"
description: >
  Lista os documentos arquivados de uma empresa na JUCESP a partir do NIRE. Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/jucesp_documentos-mcp
repository: https://github.com/mcp-dir/jucesp_documentos-mcp

tags:
  - jucesp_documentos
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_jucesp_documentos

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_jucesp_documentos/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
